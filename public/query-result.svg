<svg width="800" height="450" viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <text x="40" y="40" font-family="DM Sans" font-size="18" font-weight="bold" fill="#f1f5f9">Total Revenue by Product</text>
  <text x="40" y="60" font-family="DM Sans" font-size="12" fill="#94a3b8">Sum of revenue across all 40 rows, grouped by product</text>
  <rect x="40" y="80" width="720" height="340" rx="8" fill="#1e293b" stroke="#334155"/>
  <!-- Bar chart -->
  <rect x="80" y="400" width="80" height="-280" fill="#f472b6" rx="4"/>
  <text x="120" y="410" font-family="DM Sans" font-size="10" fill="#94a3b8" text-anchor="middle">Latte</text>
  <rect x="200" y="400" width="80" height="-220" fill="#f472b6" rx="4" opacity="0.7"/>
  <text x="240" y="410" font-family="DM Sans" font-size="10" fill="#94a3b8" text-anchor="middle">Espresso</text>
  <rect x="320" y="400" width="80" height="-180" fill="#f472b6" rx="4" opacity="0.5"/>
  <text x="360" y="410" font-family="DM Sans" font-size="10" fill="#94a3b8" text-anchor="middle">Cappuccino</text>
  <rect x="440" y="400" width="80" height="-120" fill="#f472b6" rx="4" opacity="0.4"/>
  <text x="480" y="410" font-family="DM Sans" font-size="10" fill="#94a3b8" text-anchor="middle">Croissant</text>
  <rect x="560" y="400" width="80" height="-80" fill="#f472b6" rx="4" opacity="0.25"/>
  <text x="600" y="410" font-family="DM Sans" font-size="10" fill="#94a3b8" text-anchor="middle">Muffin</text>
  <!-- Y axis labels -->
  <text x="50" y="150" font-family="DM Sans" font-size="10" fill="#94a3b8" text-anchor="end">$150K</text>
  <text x="50" y="220" font-family="DM Sans" font-size="10" fill="#94a3b8" text-anchor="end">$100K</text>
  <text x="50" y="290" font-family="DM Sans" font-size="10" fill="#94a3b8" text-anchor="end">$50K</text>
  <text x="50" y="360" font-family="DM Sans" font-size="10" fill="#94a3b8" text-anchor="end">$0</text>
  <!-- Action buttons -->
  <rect x="40" y="430" width="140" height="32" rx="4" fill="#f472b6"/>
  <text x="110" y="450" font-family="DM Sans" font-size="12" font-weight="bold" fill="#fff" text-anchor="middle">Export PNG</text>
  <rect x="190" y="430" width="140" height="32" rx="4" fill="#334155" stroke="#475569"/>
  <text x="260" y="450" font-family="DM Sans" font-size="12" font-weight="bold" fill="#fff" text-anchor="middle">Export CSV</text>
  <rect x="340" y="430" width="140" height="32" rx="4" fill="#334155" stroke="#475569"/>
  <text x="410" y="450" font-family="DM Sans" font-size="12" font-weight="bold" fill="#fff" text-anchor="middle">Export PDF</text>
</svg>