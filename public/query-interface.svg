<svg width="800" height="450" viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <text x="40" y="40" font-family="DM Sans" font-size="18" font-weight="bold" fill="#f1f5f9">Ask a question about your data</text>
  <rect x="40" y="60" width="500" height="48" rx="6" fill="#1e293b" stroke="#334155"/>
  <text x="60" y="90" font-family="DM Sans" font-size="14" fill="#f472b6">Show total revenue by product category over time</text>
  <rect x="560" y="60" width="120" height="48" rx="6" fill="#f472b6"/>
  <text x="620" y="90" font-family="DM Sans" font-size="14" font-weight="bold" fill="#fff">Get Insights</text>
  <rect x="40" y="130" width="720" height="280" rx="8" fill="#1e293b" stroke="#334155"/>
  <text x="60" y="160" font-family="DM Sans" font-size="14" font-weight="bold" fill="#f1f5f9">Generated SQL</text>
  <rect x="60" y="175" width="680" height="120" rx="4" fill="#0f172a"/>
  <text x="75" y="200" font-family="monospace" font-size="12" fill="#f472b6">SELECT</text>
  <text x="75" y="218" font-family="monospace" font-size="12" fill="#f1f5f9">  category,</text>
  <text x="75" y="236" font-family="monospace" font-size="12" fill="#f1f5f9">  SUM(revenue) AS total_revenue</text>
  <text x="75" y="254" font-family="monospace" font-size="12" fill="#f1f5f9">FROM coffee_sales</text>
  <text x="75" y="272" font-family="monospace" font-size="12" fill="#f472b6">GROUP BY</text>
  <text x="75" y="290" font-family="monospace" font-size="12" fill="#f1f5f9">  category</text>
</svg>