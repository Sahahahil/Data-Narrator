<svg width="800" height="450" viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <!-- KPI Row -->
  <rect x="20" y="20" width="760" height="80" rx="8" fill="#1e293b" stroke="#334155"/>
  <text x="40" y="65" font-family="DM Sans" font-size="14" fill="#94a3b8">TOTAL REVENUE</text>
  <text x="40" y="90" font-family="DM Sans" font-size="32" font-weight="bold" fill="#f472b6">$2.4M</text>
  <text x="220" y="65" font-family="DM Sans" font-size="14" fill="#94a3b8">ORDERS</text>
  <text x="220" y="90" font-family="DM Sans" font-size="32" font-weight="bold" fill="#f472b6">1,247</text>
  <text x="400" y="65" font-family="DM Sans" font-size="14" fill="#94a3b8">AVG ORDER</text>
  <text x="400" y="90" font-family="DM Sans" font-size="32" font-weight="bold" fill="#f472b6">$192</text>
  <text x="580" y="65" font-family="DM Sans" font-size="14" fill="#94a3b8">CUSTOMERS</text>
  <text x="580" y="90" font-family="DM Sans" font-size="32" font-weight="bold" fill="#f472b6">892</text>
  <!-- Chart 1: Bar Chart -->
  <rect x="20" y="120" width="380" height="300" rx="8" fill="#1e293b" stroke="#334155"/>
  <text x="40" y="145" font-family="DM Sans" font-size="14" font-weight="bold" fill="#f1f5f9">Revenue by Product</text>
  <rect x="40" y="380" width="50" height="-180" fill="#f472b6" rx="4"/>
  <rect x="110" y="380" width="50" height="-220" fill="#f472b6" rx="4" opacity="0.6"/>
  <rect x="180" y="380" width="50" height="-150" fill="#f472b6" rx="4" opacity="0.4"/>
  <rect x="250" y="380" width="50" height="-100" fill="#f472b6" rx="4" opacity="0.25"/>
  <rect x="320" y="380" width="50" height="-60" fill="#f472b6" rx="4" opacity="0.15"/>
  <text x="40" y="400" font-family="DM Sans" font-size="10" fill="#94a3b8">Espresso</text>
  <text x="110" y="400" font-family="DM Sans" font-size="10" fill="#94a3b8">Latte</text>
  <text x="180" y="400" font-family="DM Sans" font-size="10" fill="#94a3b8">Cappuccino</text>
  <text x="250" y="400" font-family="DM Sans" font-size="10" fill="#94a3b8">Croissant</text>
  <text x="320" y="400" font-family="DM Sans" font-size="10" fill="#94a3b8">Muffin</text>
  <!-- Chart 2: Line Chart -->
  <rect x="420" y="120" width="360" height="300" rx="8" fill="#1e293b" stroke="#334155"/>
  <text x="440" y="145" font-family="DM Sans" font-size="14" font-weight="bold" fill="#f1f5f9">Revenue Over Time</text>
  <path d="M450,380 L500,320 L550,280 L600,240 L650,260 L700,200 L750,180" stroke="#f472b6" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="450" cy="380" r="4" fill="#f472b6"/>
  <circle cx="500" cy="320" r="4" fill="#f472b6"/>
  <circle cx="550" cy="280" r="4" fill="#f472b6"/>
  <circle cx="600" cy="240" r="4" fill="#f472b6"/>
  <circle cx="650" cy="260" r="4" fill="#f472b6"/>
  <circle cx="700" cy="200" r="4" fill="#f472b6"/>
  <circle cx="750" cy="180" r="4" fill="#f472b6"/>
</svg>